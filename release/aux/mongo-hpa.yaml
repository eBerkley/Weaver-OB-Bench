apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app: mongodb
    data: shard0
  name: mongodb-shard0
  namespace: default
spec:
  behavior:
    scaleDown:
      # stabilizationWindowSeconds: 45
      selectPolicy: Disabled
    scaleUp:
      policies:
      - periodSeconds: 30
        type: Pods
        value: 5
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mongo-mongodb-sharded-shard0-data
status:
  currentMetrics: null
  desiredReplicas: 0

---

