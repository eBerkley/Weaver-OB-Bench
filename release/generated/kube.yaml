appConfig: weaver.toml

repo: docker.io/eberkley

listeners:
  - name: boutique
    port: 8080
    public: true

resourceSpec:
  requests:
    cpu: 2
    memory: "2048Mi"

  limits:
    cpu: 2
    memory: "2048Mi"
  
scalingSpec:
  minReplicas: 1
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

groups:
  - name: main
    components:
    - "github.com/ServiceWeaver/weaver/Main"
    scalingSpec:
      minReplicas: 4
      maxReplicas: 50
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 45

  - name: adservice
    components:
    - "github.com/ServiceWeaver/onlineboutique/adservice/AdService"
    scalingSpec:
      minReplicas: 2
      maxReplicas: 50
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60

  - name: cartservice
    components:
    - "github.com/ServiceWeaver/onlineboutique/cartservice/CartService"
    scalingSpec:
      minReplicas: 4
      maxReplicas: 50
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 45

  - name: cartcache
    components:
    - "github.com/ServiceWeaver/onlineboutique/cartservice/cartCache"
    scalingSpec:
      minReplicas: 1
      maxReplicas: 50
      metrics:
