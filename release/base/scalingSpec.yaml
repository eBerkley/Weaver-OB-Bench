scalingSpec:
  minReplicas: <MIN_REPLICAS>
  maxReplicas: <MAX_REPLICAS>
  behavior:
    scaleDown:
      selectPolicy: Disabled
    scaleUp:
      policies:
      - type: Pods
        value: 5
        periodSeconds: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: <AVERAGE_UTILIZATION>