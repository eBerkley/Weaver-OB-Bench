groups:
  - name: main
    components:
    - "github.com/ServiceWeaver/weaver/Main"
    scalingSpec:
      minReplicas: 6
      maxReplicas: 6
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 100


