groups:
  - name: main
    components:
    - "github.com/ServiceWeaver/onlineboutique/Main"
    scalingSpec:
      minReplicas: <CRITICAL_MIN_REPLICAS>
      maxReplicas: <OB_REPLICAS>
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: <CRITICAL_SCALE_UTIL>

  - name: adservice
    components:
    - "github.com/ServiceWeaver/onlineboutique/adservice/AdService"
    scalingSpec:
      minReplicas: <NONCRITICAL_MIN_REPLICAS>
      maxReplicas: <OB_REPLICAS>
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: <NONCRITICAL_SCALE_UTIL>

  - name: checkoutservice
    components:
    - "github.com/ServiceWeaver/onlineboutique/checkoutservice/CheckoutService"
    scalingSpec:
      minReplicas: <NONCRITICAL_MIN_REPLICAS>
      maxReplicas: <OB_REPLICAS>
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: <NONCRITICAL_SCALE_UTIL>

  - name: recommendationservice
    components:
    - "github.com/ServiceWeaver/onlineboutique/recommendationservice/RecommendationService"
    scalingSpec:
      minReplicas: <NONCRITICAL_MIN_REPLICAS>
      maxReplicas: <OB_REPLICAS>
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: <NONCRITICAL_SCALE_UTIL>

  - name: all
    components:
    - "github.com/ServiceWeaver/onlineboutique/cartservice/CartService"
    - "github.com/ServiceWeaver/onlineboutique/cartservice/cartCache"
    - "github.com/ServiceWeaver/onlineboutique/currencyservice/CurrencyService"
    - "github.com/ServiceWeaver/onlineboutique/emailservice/EmailService"
    - "github.com/ServiceWeaver/onlineboutique/paymentservice/PaymentService"
    - "github.com/ServiceWeaver/onlineboutique/productcatalogservice/CatalogService"
    - "github.com/ServiceWeaver/onlineboutique/shippingservice/ShippingService"
    scalingSpec:
      minReplicas: <NONCRITICAL_MIN_REPLICAS>
      maxReplicas: <OB_REPLICAS>
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: <NONCRITICAL_SCALE_UTIL>
